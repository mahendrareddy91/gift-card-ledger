<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gift Card Ledger</title>
<meta name="theme-color" content="#0F6E52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cards">
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
html,body{margin:0;padding:0;background:#F3F6F8;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
#root{min-height:100vh}
.msg{max-width:620px;margin:60px auto;padding:22px;border:1px solid #DBE2E8;background:#fff;
  border-radius:14px;font:14px/1.6 system-ui,-apple-system,sans-serif;color:#16202B}
.msg b{display:block;margin-bottom:6px}
.gate{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:24px 18px calc(24px + env(safe-area-inset-bottom));
  background:linear-gradient(165deg,#0F6E52 0%,#0A4838 55%,#082F26 100%);
  font-family:'Space Grotesk',system-ui,-apple-system,sans-serif}
.gate-box{width:100%;max-width:360px;background:#fff;border-radius:20px;padding:30px 26px 24px;
  display:flex;flex-direction:column;box-shadow:0 26px 60px -30px rgba(0,0,0,.6);text-align:center}
.gate-mark{width:56px;height:56px;border-radius:16px;background:#E7F3EE;display:flex;
  align-items:center;justify-content:center;margin:0 auto 16px}
.gate-box h1{font-size:21px;font-weight:700;letter-spacing:-.02em;margin:0 0 7px;color:#16202B}
.gate-box p{font-size:13px;line-height:1.5;color:#65727F;margin:0 0 20px}
.gate-box input{width:100%;padding:14px 15px;font-size:16px;font-family:'IBM Plex Mono',monospace;
  border:1.5px solid #DBE2E8;border-radius:12px;background:#F7F9FB;color:#16202B;outline:none}
.gate-box input:focus{border-color:#0F6E52;background:#fff}
.gate-err{font-size:12.5px;color:#C0362B;margin-top:10px;text-align:left}
.gate-box button{margin-top:14px;width:100%;padding:14px;font-size:15px;font-weight:600;
  font-family:inherit;color:#fff;background:#0F6E52;border:none;border-radius:12px;cursor:pointer}
.gate-box button:disabled{opacity:.42;cursor:default}
.gate-foot{display:block;margin-top:16px;font-size:11px;line-height:1.5;color:#8C97A3}
</style>
</head>
<body>
<div id="root"></div>
<div id="boot"><div class="msg"><b>The ledger didn't start.</b>
The page loaded but its script never ran — usually because it was opened somewhere that blocks
scripts. Open the site URL in a normal browser tab.</div></div>
<noscript><div class="msg"><b>JavaScript is turned off.</b> This ledger needs it.</div></noscript>
<script src="./payload.js"></script>

@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
.gl-root{--bg:#F3F6F8;--surf:#FFFFFF;--surf2:#E9EEF2;--line:#DBE2E8;--text:#16202B;--muted:#65727F;
--red:#C0362B;--green:#0F7A52;--gold:#A8760C;--loan:#A9660F;
--hero1:#0F6E52;--hero2:#0A4838;
background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;
min-height:100vh;padding:18px 14px 96px;-webkit-font-smoothing:antialiased;}
.gl-root *{box-sizing:border-box;}
.gl-wrap{max-width:600px;margin:0 auto;}
.gl-mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
.gl-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);}
.gl-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;}
.gl-title{font-size:30px;font-weight:700;letter-spacing:-.025em;margin:2px 0 0;}

.gl-faces{display:grid;grid-template-columns:1fr;gap:16px;margin-bottom:22px;max-width:400px;}
.gl-faces:has(.gl-side:only-child){max-width:400px;}
@media (min-width:820px){.gl-faces{grid-template-columns:1fr 1fr;max-width:836px;}}
.gl-side{position:relative;width:100%;aspect-ratio:1.586/1;border-radius:16px;padding:18px;
display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;
box-shadow:0 8px 24px -16px rgba(22,32,43,.75);}
.gl-back{background:#fff;border:1px solid var(--line);justify-content:center;gap:8px;padding:18px 16px;}
.gl-frontmark{transform:scale(1.6);transform-origin:left top;}
.gl-frontfoot{display:flex;flex-direction:column;}
.gl-stripe{position:absolute;left:0;right:0;top:14px;height:30px;background:#15171A;}
.gl-backbody{margin-top:38px;width:100%;}
.gl-backgrid{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;margin-top:9px;}
.gl-backgrid span{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#111;letter-spacing:.06em;}
.gl-backgrid span.wide{flex:1 0 100%;text-align:center;}
.gl-backgrid em{font-style:normal;color:#888;margin-right:6px;font-size:9px;letter-spacing:.14em;text-transform:uppercase;}
.gl-balstrip{display:flex;flex-direction:column;margin:0 0 6px;}
.gl-balstrip .gl-dbal{margin-top:0;}
.gl-visa .gl-artsvg{opacity:1;}
.gl-visanum{position:absolute;left:6%;bottom:34%;font-family:'IBM Plex Mono',monospace;
font-size:15px;font-weight:500;letter-spacing:.06em;color:#20262C;
text-shadow:0 1px 0 rgba(255,255,255,.7);white-space:nowrap;}
.gl-visathru{position:absolute;left:6%;bottom:20%;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#20262C;}
.gl-visathru em{font-style:normal;font-size:5.5px;letter-spacing:.06em;display:inline-block;
line-height:1.15;vertical-align:middle;margin-right:4px;color:#41484F;}
.gl-visaname{position:absolute;left:6%;bottom:8%;font-family:'IBM Plex Mono',monospace;
font-size:10.5px;letter-spacing:.09em;color:#20262C;white-space:nowrap;}
.gl-visalogo{font-weight:800;font-style:italic;letter-spacing:-.02em;color:#fff;
text-shadow:0 1px 2px rgba(0,0,0,.28);}
.gl-wallet .gl-visalogo{left:auto;right:118px;top:50%;transform:translateY(-50%);bottom:auto;font-size:19px;}
.gl-front .gl-visalogo{left:auto;right:20px;bottom:14px;top:auto;transform:none;font-size:32px;}
.gl-front .gl-visanum{font-size:24px;}
.gl-front .gl-visathru{font-size:15px;}
.gl-front .gl-visathru em{font-size:7px;}
.gl-front .gl-visaname{font-size:14px;}
.gl-front .gl-visalogo{font-size:32px;right:20px;bottom:14px;}
.gl-backnum{font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:.16em;
text-align:center;color:#111;user-select:all;}
.gl-backmeta{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;
text-align:center;color:#666;}
@media (prefers-reduced-motion:reduce){.gl-flip{transition:none;}}

.gl-howto{display:grid;gap:16px;margin-top:16px;}
@media (min-width:820px){.gl-howto{grid-template-columns:1fr 1fr;gap:24px;}}
.gl-howto ol{margin:8px 0 0;padding-left:18px;}
.gl-howto li{font-size:13.5px;line-height:1.55;margin-bottom:5px;color:var(--text);}
.gl-scan{position:fixed;inset:0;z-index:200;background:#fff;display:flex;align-items:center;
justify-content:center;cursor:zoom-out;}
.gl-scanrot{transform:rotate(90deg);width:86vh;max-width:1100px;flex:0 0 auto;text-align:center;}
@media (min-aspect-ratio:1/1){.gl-scanrot{transform:none;width:min(86vw,900px);}}
.gl-scanrot svg{width:100%;height:auto;display:block;}
.gl-scannum{font-family:'IBM Plex Mono',monospace;font-size:15px;letter-spacing:.16em;
color:#000;margin-top:10px;}
.gl-scanpin{font-family:'IBM Plex Mono',monospace;font-size:23px;font-weight:600;color:#000;margin-top:8px;}
.gl-scanbrand{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;
text-transform:uppercase;color:#777;margin-top:10px;}
.gl-scanhint{position:fixed;bottom:14px;left:0;right:0;text-align:center;
font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;
text-transform:uppercase;color:#999;}
.gl-hist{border-top:1px solid var(--line);margin-top:8px;}
.gl-histrow{display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);}
.gl-histdesc{display:block;font-size:14px;font-weight:600;}
.gl-histsub{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);margin-top:3px;letter-spacing:.04em;}
.gl-histamt{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;}

.gl-detailcard{border-radius:18px;padding:20px;margin-bottom:20px;box-shadow:0 6px 20px -12px rgba(22,32,43,.7);}
.gl-dbal{font-family:'IBM Plex Mono',monospace;font-size:34px;font-weight:500;letter-spacing:-.035em;
font-variant-numeric:tabular-nums;line-height:1;margin-top:26px;}
.gl-dsub{font-family:'IBM Plex Mono',monospace;font-size:11px;opacity:.75;margin-top:8px;letter-spacing:.05em;}
.gl-barcodebox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 14px;}
.gl-bignum{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:500;letter-spacing:.1em;
word-break:break-all;line-height:1.45;margin-top:7px;user-select:all;}
@media (max-width:420px){.gl-bignum{font-size:19px;}.gl-dbal{font-size:30px;}}
.gl-spill{background:var(--surf);border:2px solid var(--gold);border-radius:14px;padding:14px;margin-bottom:14px;}
.gl-menu{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px 16px 16px;
margin-bottom:14px;box-shadow:0 1px 2px rgba(22,32,43,.05);}
.gl-mgroup{margin-bottom:13px;}
.gl-mgroup:last-child{margin-bottom:0;}
.gl-mgroup .gl-lbl{display:block;margin-bottom:7px;}
.gl-hero{background:linear-gradient(135deg,var(--hero1) 0%,var(--hero2) 100%);border:0;border-radius:16px;
padding:20px 20px 18px;margin-bottom:16px;color:#fff;box-shadow:0 6px 18px -10px rgba(10,72,56,.7);}
.gl-hero .gl-eyebrow{color:rgba(255,255,255,.72);}
.gl-hero .gl-meta{color:#fff;}
.gl-hero .gl-meta.warn{color:#FFD9D4;}
.gl-hero .amt{font-family:'IBM Plex Mono',monospace;font-size:38px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;display:block;margin-top:2px;}
.gl-split{display:flex;gap:10px;margin-top:14px;}
.gl-cell{flex:1;background:rgba(255,255,255,.14);border-radius:10px;padding:10px 12px;}
.gl-cell .k{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.7);display:block;}
.gl-cell .v{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;}
.gl-bar{height:4px;background:var(--surf2);border-radius:99px;overflow:hidden;margin-top:13px;}
.gl-bar>i{display:block;height:100%;background:var(--green);transition:width .5s ease;}

.gl-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.gl-btn{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;border:1px solid var(--line);
background:var(--surf2);color:var(--text);border-radius:99px;padding:9px 16px;cursor:pointer;}
.gl-btn.solid{background:var(--text);color:#fff;border-color:var(--text);}
.gl-btn.sm{font-size:12px;padding:7px 12px;}
.gl-btn.danger{color:var(--red);border-color:#4A2A28;background:transparent;}
.gl-btn[disabled]{opacity:.4;cursor:default;}
.gl-btn:focus-visible,.gl-in:focus-visible,.gl-tab:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.gl-chip{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:99px;padding:6px 11px;cursor:pointer;}
.gl-chip[data-on="1"]{border-color:var(--text);color:var(--text);}
.gl-chip[data-alert="1"]{border-color:#4A2A28;color:var(--red);}

.gl-card{position:relative;margin-bottom:18px;}
.gl-card[data-done="1"]{opacity:.38;}
.gl-initials{font-weight:700;letter-spacing:.02em;color:#fff;}

/* --- wallet layout: the row is a gift card face --- */
.gl-wallet{display:block;width:100%;height:118px;box-sizing:border-box;position:relative;
border-radius:15px;padding:15px 16px 14px;isolation:isolate;text-align:left;
font-family:inherit;cursor:pointer;border:0;position:relative;overflow:hidden;
box-shadow:0 4px 14px -8px rgba(22,32,43,.5);}
.gl-wallet::after{content:"";position:absolute;inset:0;border-radius:15px;
background:radial-gradient(120% 90% at 88% 8%, rgba(255,255,255,.14) 0%, transparent 58%);pointer-events:none;}
.gl-art{position:absolute;inset:0;overflow:hidden;pointer-events:none;user-select:none;z-index:0;
border-radius:inherit;opacity:1;}
/* on a pill the art is confined to the band between the balance and the digits */
.gl-artsvg{position:absolute;inset:0;width:100%;height:100%;}
.gl-artlogo{position:absolute;left:15px;top:12px;line-height:0;z-index:1;pointer-events:none;}
.gl-brooks{display:flex;align-items:center;justify-content:center;}
.gl-teen{display:flex;align-items:center;justify-content:center;}
.gl-splogo{font-weight:700;font-size:17px;letter-spacing:-.04em;color:#1B1B4B;}
.gl-side.gl-front .gl-artlogo.gl-splogo{left:16px;top:14px;right:auto;bottom:auto;}
.gl-sptag{position:absolute;right:16px;top:15px;font-weight:800;font-size:10px;letter-spacing:.02em;
color:#1B1B4B;z-index:1;}
.gl-spjb{display:flex;align-items:center;justify-content:center;background:#FBE94F;}
.gl-tgg{display:flex;align-items:center;justify-content:center;padding:0 12%;}
.gl-tggmark{width:100%;line-height:0;}
.gl-tggmark svg{width:100%;height:auto;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.28));}
.gl-hm{display:flex;align-items:center;justify-content:center;}
.gl-hmmark{font-weight:800;font-style:italic;font-size:62px;letter-spacing:-.05em;color:#C7211F;
text-shadow:0 1px 0 rgba(255,255,255,.28), 0 -1px 0 rgba(0,0,0,.22);}
.gl-kmartlogo{line-height:0;}
.gl-kmartlogo svg{width:62px;height:auto;display:block;}
.gl-kmartlogo em{display:none;}
.gl-front .gl-kmartlogo svg{width:126px;}
.gl-front .gl-kmartlogo em{display:block;font-style:normal;font-size:17px;font-weight:400;
color:#242A36;margin-top:14px;line-height:1.2;}
.gl-front .gl-kmartlogo em b{font-weight:700;}
.gl-side.gl-front .gl-artlogo.gl-kmartlogo{left:22px;top:22px;right:auto;bottom:auto;}
.gl-konly-front{display:none;}
.gl-front .gl-konly-front{display:block;}
.gl-front .gl-konly-pill{display:none;}
.gl-imaxlogo{line-height:0;}
.gl-imaxlogo svg{width:62px;height:auto;display:block;}
.gl-front .gl-imaxlogo svg{width:104px;}
.gl-art-apple{display:flex;align-items:center;justify-content:center;left:auto;right:104px;width:62px;opacity:1;}
.gl-applemark{width:38px;height:38px;}
.gl-front .gl-art-apple{right:auto;left:0;width:100%;}
.gl-front .gl-applemark{width:38%;height:auto;}
.gl-art-center{display:flex;flex-direction:column;align-items:center;justify-content:center;}
.gl-jb{font-weight:800;font-size:21px;letter-spacing:-.045em;color:#151510;line-height:1;}
.gl-jbsub{font-weight:700;font-size:7px;letter-spacing:.26em;color:#151510;margin-top:5px;}
.gl-front .gl-artlogo{left:auto;right:18px;bottom:16px;top:auto;}
.gl-front .gl-jb{font-size:46px;}
.gl-front .gl-art-center{left:0;right:0;}
.gl-front .gl-jbsub{font-size:13px;}
.gl-front .gl-jb{font-size:44px;}
.gl-front .gl-jbsub{font-size:12px;}
.gl-front .gl-arttag{font-size:11px;}
.gl-ghost{position:absolute;right:-4%;top:50%;transform:translateY(-50%) scale(4.4);
transform-origin:right center;opacity:.075;max-width:60%;pointer-events:none;user-select:none;z-index:0;
white-space:nowrap;}
.gl-ghost-lg{transform:translateY(-50%) scale(5.5);opacity:.07;right:-4%;}
.gl-wtop,.gl-wbot,.gl-frontfoot{position:relative;z-index:1;}
.gl-frontmark{position:relative;z-index:1;display:inline-flex;align-self:flex-start;max-width:60%;}
.gl-wtop{position:absolute;left:16px;right:16px;top:15px;display:flex;justify-content:space-between;
align-items:flex-start;gap:12px;height:30px;padding-right:132px;box-sizing:border-box;}
.gl-wname{font-size:12px;font-weight:600;opacity:.82;letter-spacing:.01em;text-align:right;min-height:1px;display:flex;align-items:center;gap:6px;height:30px;}
.gl-wbot{position:absolute;left:16px;right:16px;bottom:14px;display:flex;
justify-content:space-between;align-items:flex-end;gap:12px;}
.gl-wamt{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:500;letter-spacing:-.025em;
font-variant-numeric:tabular-nums;line-height:1;opacity:.86;}
.gl-wamt{position:relative;}
.gl-wamt small{position:absolute;bottom:100%;left:0;margin-bottom:4px;font-size:11px;opacity:.6;
text-decoration:line-through;font-weight:400;letter-spacing:0;white-space:nowrap;}
.gl-wamt .gl-off{position:absolute;bottom:100%;left:0;margin-bottom:4px;font-size:9px;
font-weight:600;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;
background:var(--tint);border-radius:99px;padding:2px 7px;opacity:.92;line-height:1.25;}
.gl-wamt small + .gl-off{left:auto;margin-left:0;transform:translateX(calc(100% + 0px));}
.gl-wamt.has-both small{left:0;}
.gl-wamt.has-both .gl-off{left:0;transform:none;margin-left:0;}
.gl-wnum{font-family:'IBM Plex Mono',monospace;font-size:11.5px;opacity:.72;letter-spacing:.13em;text-align:right;}

.gl-panel{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(22,32,43,.05);}

.gl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.gl-field{display:flex;flex-direction:column;gap:5px;}

.gl-in{font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--text);border:1px solid var(--line);

.gl-detail{border-top:1px solid var(--line);margin-top:11px;padding-top:11px;}
.gl-code{font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:.08em;word-break:break-all;

.gl-empty{border:1px dashed var(--line);border-radius:12px;padding:34px 18px;text-align:center;color:var(--muted);font-size:14px;}
.gl-note{font-family:'IBM Plex Mono',monospace;font-size:9.5px;opacity:.7;color:var(--muted);line-height:1.65;margin-top:24px;border-top:1px solid var(--line);padding-top:12px;}

.gl-deadline{display:flex;align-items:center;gap:13px;background:#FFF3E2;border:1px solid #F0C98A;
border-left:4px solid #C97A14;border-radius:12px;padding:12px 14px;margin:0 0 14px;}
.gl-dlday{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
min-width:46px;font-family:'IBM Plex Mono',monospace;font-size:21px;font-weight:600;color:#8A4E05;line-height:1;}

.gl-tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);
border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:9px 8px calc(9px + env(safe-area-inset-bottom));z-index:20;}
.gl-tab{flex:1;max-width:112px;background:transparent;border:0;cursor:pointer;padding:5px 4px;border-radius:9px;
font-family:'Space Grotesk',sans-serif;color:var(--muted);}

.gl-tab .t{display:block;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gl-tab .s{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;margin-top:1px;font-variant-numeric:tabular-nums;}
.gl-list{display:block;}
.gl-list > .gl-card{padding-top:17px;}
.gl-list > .gl-card > .gl-tools{top:27px;}
.gl-sections{display:block;}
.gl-section{margin-bottom:26px;}
.gl-section{margin-bottom:34px;}
.gl-expand{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:16px;
box-shadow:0 1px 2px rgba(22,32,43,.05);}
.gl-tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;}
.gl-table{width:100%;border-collapse:collapse;font-family:inherit;}

.gl-table th.num,.gl-table td.num{text-align:right;padding-right:4px;}

.gl-table td.name{font-size:14px;font-weight:600;white-space:nowrap;}
.gl-table td.bal{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;}

border-radius:99px;padding:4px 9px;cursor:pointer;vertical-align:middle;}

/* phone: the table becomes stacked blocks instead of scrolling sideways */
@media (max-width:700px){
  .gl-tablewrap{overflow-x:visible;margin:0;}
  .gl-table{display:block;}
  .gl-table thead{display:none;}
  .gl-table tbody,.gl-table tfoot{display:block;}
  .gl-table tr{display:grid;grid-template-columns:1fr auto;gap:9px 10px;align-items:center;
    border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:11px;background:var(--bg);}
  .gl-table td{display:block;border-bottom:0;padding:0;text-align:left;}
  .gl-table td.num{padding-right:0;}
  .gl-table td.name{grid-column:1/-1;font-family:'IBM Plex Mono',monospace;font-size:10px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500;}
  .gl-table td:nth-child(2){grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .gl-table td.bal{grid-column:1;font-size:19px;text-align:left;padding-left:0;}

  .gl-table tfoot tr{background:transparent;border:0;padding:4px 13px 0;}

  .gl-fullcode{font-size:14.5px;letter-spacing:.1em;}

}

.gl-rname{flex:0 0 84px;font-size:13px;font-weight:600;}

@media (min-width:820px){.gl-rail{grid-template-columns:1fr 1fr 1fr;}}

.gl-ledger{display:flex;align-items:center;gap:12px;width:100%;background:var(--surf);
border:1px solid var(--line);border-radius:10px;padding:11px 36px 11px 13px;text-align:left;

/* Laptop: wider canvas, cards in a grid, nav inline at the top */
@media (min-width:760px){
  .gl-root{padding:26px 22px 40px;}
  .gl-wrap{max-width:1040px;}
  .gl-title{font-size:34px;}
  .gl-hero{display:grid;grid-template-columns:minmax(210px,1fr) 2fr;gap:22px;align-items:center;padding:20px 22px;}
  .gl-hero .amt{font-size:42px;}
  .gl-split{margin-top:0;}
  .gl-sections{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 22px;align-items:start;}
  .gl-sections > .gl-open{grid-column:1/-1;}
  /* a section already occupies one column, so its own list must be single-file...  */
  .gl-sections > .gl-section .gl-list{grid-template-columns:minmax(0,1fr);}
  /* ...unless the brand is expanded, in which case it spans the row and can fan out */
  .gl-sections > .gl-open .gl-list{grid-template-columns:repeat(2,minmax(0,1fr));}
  .gl-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start;}
  .gl-list[data-l="ledger"]{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
  .gl-list[data-l="shelf"]{grid-template-columns:repeat(4,minmax(0,1fr));}
  .gl-card{margin-bottom:0;}
  .gl-empty{grid-column:1/-1;}
  .gl-tabs{position:static;background:transparent;backdrop-filter:none;border-top:0;border-bottom:1px solid var(--line);

  .gl-tab{flex:0 0 auto;max-width:none;min-width:96px;padding:8px 14px;}
  .gl-grid{grid-template-columns:repeat(3,1fr);}

@media (min-width:1180px){
  .gl-sections{grid-template-columns:repeat(3,minmax(0,1fr));}
  .gl-sections > .gl-open .gl-list{grid-template-columns:repeat(3,minmax(0,1fr));}
  .gl-list[data-l="ledger"]{grid-template-columns:repeat(2,minmax(0,1fr));}
  .gl-list[data-l="shelf"]{grid-template-columns:repeat(5,minmax(0,1fr));}
